#Basic settings
compute_baseline : true
name : "baseline_it"
lang : "it"
model : "nickprock/setfit-italian-hate-speech"
seed : 67
skip_pretrain : false
freeze_bio_encoder : false
use_focal_loss : false
gamma : 2.0
weighted_sampling : false
# Use LPFT
lpft : false
#Standard settings
#pretrain
val_size_pretrain : 0.15
test_size_pretrain : 0.15
lr_pretrain : 2e-5
batch_size_pretrain : 8
weight_decay_pretrain : 0.1
#main stage
val_size_mainstage : 0.15
test_size_mainstage : 0.15
lr_mainstage : 2e-5
batch_size_mainstage : 8
weight_decay_mainstage : 0.1

